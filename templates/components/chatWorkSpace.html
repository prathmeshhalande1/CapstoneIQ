<div id="chatView" class="d-flex flex-grow-1" style="min-width: 0;">
    <div class="groupSidebar">
        <div class="p-3 border-bottom border-secondary border-opacity-25">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h6 class="fw-bold m-0">Groups <span class="badge bg-secondary bg-opacity-50"
                        id="visible-group-count">{{ user_groups.count }}</span></h6>
                <div class="d-flex gap-1">
                    <button class="btn btn-sm btn-outline-info py-1 px-2" data-bs-toggle="modal"
                        data-bs-target="#joinGroupModal">🔑 Join</button>
                    <button class="btn btn-sm btn-primary py-1 px-2" data-bs-toggle="modal"
                        data-bs-target="#createGroupModal">+ Create</button>
                </div>
            </div>

            <div class="d-flex gap-2 mb-2">
                <input type="text" id="groupSearchInput" class="form-control form-control-sm form-control-dark"
                    placeholder="Search groups..." onkeyup="applyGroupFilters()">
                <select id="groupSortSelect" class="form-select form-select-sm form-control-dark" style="width: 110px;"
                    onchange="applyGroupFilters()">
                    <option value="default">Sort: All</option>
                    <option value="name-asc">A - Z</option>
                    <option value="name-desc">Z - A</option>
                </select>
            </div>
        </div>

        <div class="overflow-auto flex-grow-1" id="groupList">
            {% for group in user_groups %}
            <div class="group-item {% if forloop.first %}active{% endif %}" data-name="{{ group.groupName }}"
                data-size="{{ group.group_members.count }}"
                onclick="selectGroup('{{ group.groupName }}', '{{ group.category_badge }}', '{{ group.group_members.count }}', '{{ group.groupCode }}', this)">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <h6 class="fw-bold mb-0 text-truncate">{{ group.groupName }}</h6>
                    <span class="badge bg-primary bg-opacity-25 text-info">{{ group.category_badge }}</span>
                </div>
                <div class="d-flex justify-content-between align-items-center">
                    <small class="text-secondary">{{ group.repositories.count }} Repos Active</small>
                    <small class="text-light badge bg-secondary bg-opacity-25">👥 {{ group.group_members.count }}</small>
                </div>
            </div>
            {% empty %}
            <div class="p-3 text-center text-muted">
                <small>No groups found. Create one or join using an invite code!</small>
            </div>
            {% endfor %}
        </div>

    </div>
</div>
