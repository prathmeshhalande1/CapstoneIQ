{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - CapstoneIQ</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/commen.css' %}">
    <link rel="stylesheet" href="{% static 'css/otp.css' %}">
</head>

<body style="background-color: #0b0b0f; color: #fff;">

    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="col-11 col-sm-8 col-md-6 col-lg-4">
            <div class="glass p-4 p-md-5 rounded-4 text-center">
                <h2 class="mb-3">Enter OTP</h2>
                <p class="text-secondary small mb-4">Enter the code sent to your email and your new password.</p>

                {% if messages %}
                {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }} py-2 text-start" role="alert">
                    {{ message }}
                </div>
                {% endfor %}
                {% endif %}

                <form method="POST" action="{% url 'verifyAccountOtp' %}">
                    {% csrf_token %}
                    <div class="mb-3 text-start">
                        <label class="form-label">OTP Code</label>
                        <input type="text" name="otp" class="form-control text-center fs-4 tracking-widest"
                            maxlength="6" placeholder="000000" required>
                    </div>

                    <div class="mb-3 text-start">
                        <label class="form-label">New Password</label>
                        <input type="password" name="new_password" class="form-control" placeholder="••••••••" required>
                    </div>

                    <div class="mb-3 text-start">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" name="confirm_password" class="form-control" placeholder="••••••••"
                            required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mt-2">Reset Password</button>
                </form>
            </div>
        </div>
    </div>

</body>

</html>
