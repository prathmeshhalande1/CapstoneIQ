{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CapstoneIQ - Academic Workspace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/index.css' %}">
    <link rel="stylesheet" href="{% static 'css/commen.css' %}">
</head>

<body>

    <div class="appContainer">
        <div class="navRail">
            <button class="navIconBtn active" id="btnChatView" title="Groups & Chat"
                onclick="switchMainView('chatView', this)">💬</button>
            <button class="navIconBtn" id="btnAnalyticsView" title="Full-Screen Analytics"
                onclick="switchMainView('analyticsView', this)">📊</button>
            <button class="navIconBtn" id="btnProfileView" title="Profile & Manage Repos"
                onclick="switchMainView('profileView', this)">⚙️</button>
            <div class="mt-auto">
                {%if request.user.is_authenticated%}
                <a href="{% url 'logout' %}" class="navIconBtn text-danger" title="Log Out">logout</a>
                {%else%}
                <a href="{% url 'login' %}" class="navIconBtn text-danger" title="Log Out">login</a>
                {%endif%}
            </div>
        </div>

        {% include 'components/chatWorkSpace.html' %}
        {% include 'components/analyticsView.html' %}
        {% include 'components/profile.html' %}
        {% include 'components/Modals.html' %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'js/index.js' %}"></script>

</body>

</html>
