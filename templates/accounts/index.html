{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CapstoneIQ - Academic Workspace</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/index.css' %}">
    <link rel="stylesheet" href="{% static 'css/commin.css' %}">
</head>

<body>

    <div class="appContainer">
        <div class="navRail">
            <button class="navIconBtn active" id="btnChatView" title="Groups & Chat"
                onclick="switchMainView('chatView', this)">💬</button>
            <button class="navIconBtn" id="btnAnalyticsView" title="Full-Screen Analytics"
                onclick="switchMainView('analyticsView', this)">📊</button>
            <button class="navIconBtn" id="btnProfileView" title="Profile & Manage Repos"
                onclick="switchMainView('profileView', this)">⚙️</button>
            <div class="mt-auto">
                {%if request.user.is_authenticated%}
                <a href="{% url 'logout' %}" class="navIconBtn text-danger" title="Log Out">🚪</a>
                {%else%}
                <a href="{% url 'login' %}" class="navIconBtn text-danger" title="Log Out">🚪</a>
                {%endif%}
            </div>
        </div>

        {% include 'components/chatWorkSpace.html' %}
        {% include 'components/analyticsView.html' %}
        {% include 'components/profileAndModals.html' %}
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'js/index.js' %}"></script>

</body>

</html>
