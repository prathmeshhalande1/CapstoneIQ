{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - CapstoneIQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/commen.css' %}">
    <link rel="stylesheet" href="{% static 'css/otp.css' %}">
</head>

<body style="background-color: #0b0b0f; color: #fff;">

    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="col-11 col-sm-8 col-md-6 col-lg-4">
            <div class="glass p-4 p-md-5 rounded-4 text-center">
                <h2 class="mb-4">Reset Password</h2>

                {% if messages %}
                {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }} py-2 text-start" role="alert">
                    {{ message }}
                </div>
                {% endfor %}
                {% endif %}

                <form method="POST" action="{% url 'forgotPassword' %}">
                    {% csrf_token %}
                    <div class="mb-3 text-start">
                        <label class="form-label">Registered Email</label>
                        <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mt-2">Send OTP</button>
                </form>

                <div class="mt-4 text-muted">
                    Remembered password? <a href="{% url 'login' %}" class="text-info text-decoration-none">Log in</a>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
