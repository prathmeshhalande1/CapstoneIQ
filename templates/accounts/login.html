{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login - CapstoneIQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css'%}">
    <link rel="stylesheet" href="{% static 'css/commen.css' %}">
    <link rel="stylesheet" href="{% static 'css/otp.css' %}">
</head>

<body style="background-color:  #0b0b0f;">

    <div class=" container d-flex justify-content-center align-items-center vh-100">
        <div class="col-11 col-sm-8 col-md-6 col-lg-4">
            <div class="glass p-4 p-md-5 rounded-4 text-center">
                <h2>CapstoneIQ Login</h2>

                {% if messages %}
                {% for message in messages %}
                <div class="">
                    {{ message }}
                    Don't have an account? <a href="{% url 'forgotPassword' %}">forgot password</a>
                </div>
                {% endfor %}
                {% endif %}

                <form method="POST" action="{% url 'login' %}">
                    {% csrf_token %}
                    <div class="">
                        <label>Username</label>
                        <input type="text" name="username" required>
                    </div>
                    <div class="">
                        <label>Password</label>
                        <input type="password" name="password" required>
                    </div>
                    <button type="submit" class="">logIn</button>
                </form>

                <div class="">
                    Don't have an account? <a href="{% url 'signup' %}">Sign up</a>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
