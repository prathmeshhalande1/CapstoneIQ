{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login - CapstoneIQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css'%}">
    <link rel="stylesheet" href="{% static 'css/commen.css' %}">
    <link rel="stylesheet" href="{% static 'css/otp.css' %}">
    <style>
        .glass-success { border-left: 4px solid #198754 !important; } 
        .glass-error { border-left: 4px solid #dc3545 !important; }   
        .glass-warning { border-left: 4px solid #ffc107 !important; } 
        .glass-info { border-left: 4px solid #0dcaf0 !important; }    
    </style>
</head>

<body style="background-color:  #0b0b0f;">

    {% if messages %}
    <div class="position-fixed top-0 end-0 p-4" style="z-index: 1050;">
        {% for message in messages %}
        <div class="alert glass glass-{{ message.tags }} alert-dismissible fade show d-flex align-items-center px-4 py-3"
            role="alert">
            <span class="text-white">{{ message }}</span>
            <button type="button" class="btn-close btn-close-white ms-3" data-bs-dismiss="alert" aria-label="Close"
                style="position: relative; right: 0; padding: 0;"></button>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="col-11 col-sm-8 col-md-6 col-lg-4">
            <div class="glass p-4 p-md-5 rounded-4 text-center">
                <h2>CapstoneIQ Login</h2>
                <form method="POST" action="{% url 'login' %}">
                    {% csrf_token %}
                    <div class="modal-body text-start">
                        <div class="mb-3">
                            <label class="text-white-50 form-label">Username</label>
                            <input type="text" name="username" class="glass-input form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="text-white-50 form-label">Password</label>
                            <input type="password" name="password" class="form-control glass-input" required>
                        </div>
                        <div class="text-center mt-4">
                            <button type="submit" class="btn glass-btn-primary mt-1 w-50 py-1 fs-5">LogIn</button>
                        </div>
                    </div>
                </form>

                <div class="">
                    Don't have an account? <a href="{% url 'signup' %}">Sign up</a>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>

    <script>
        setTimeout(function() {
            let alerts = document.querySelectorAll('.alert');
            alerts.forEach(function(alert) {
                alert.style.transition = "opacity 0.5s ease";
                alert.style.opacity = "0";
                setTimeout(() => alert.remove(), 500);
            });
        }, 5000);
    </script>
</body>

</html>
