{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Verify OTP - CapstoneIQ</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css'%}">
    <link rel="stylesheet" href="{% static 'css/otp.css' %}">
</head>

<body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="col-11 col-sm-8 col-md-6 col-lg-4">
            <div class="glass p-4 p-md-5 rounded-4 text-center">
                <h2 class="fw-bold mb-2">Security Verification</h2>
                <p class="text-secondary small mb-4">Enter the 6-digit code sent to your email address.</p>
                {% if messages %}
                {% for message in messages %}
                <div class="alert alert-danger py-2 small bg-opacity-25 border-danger text-danger mb-3" role="alert">
                    {{ message }}
                </div>
                {% endfor %}
                {% endif %}
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <input type="text" name="otp" class="form-control otp-input py-2 rounded-3" maxlength="6"
                            placeholder="------" required autocomplete="off">
                    </div>
                    <button type="submit" class="btn btn-light w-100 py-2 fw-semibold rounded-3">Verify Account</button>
                </form>
            </div>
        </div>
    </div>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>

</html>
