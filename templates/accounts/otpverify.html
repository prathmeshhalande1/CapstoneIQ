{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Verify OTP - CapstoneIQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css'%}">
    <link rel="stylesheet" href="{% static 'css/commen.css' %}">
    <link rel="stylesheet" href="{% static 'css/otp.css' %}">
</head>

<body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="col-11 col-sm-8 col-md-6 col-lg-4">
            <div class="glass p-4 p-md-5 rounded-4 text-center">
                <h2 class="fw-bold mb-2">Security Verification</h2>
                <p class="text-secondary small mb-4">Enter the 6-digit code sent to your email address.</p>
                {% if messages %}
                {% for message in messages %}
                <div class="alert alert-danger py-2 small bg-opacity-25 border-danger text-danger mb-3" role="alert">
                    {{ message }}
                </div>
                {% endfor %}
                {% endif %}
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <input type="text" name="otp" class="form-control otp-input py-2 rounded-3" maxlength="6"
                            placeholder="------" required autocomplete="off">
                    </div>
                    <button type="submit" class="btn btn-light w-100 py-2 fw-semibold rounded-3">Verify Account</button>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>

</html>
